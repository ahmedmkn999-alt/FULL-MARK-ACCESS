<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FULL MARK | PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --bg: #f1f5f9; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        
        .header { text-align: center; padding: 30px; color: var(--primary); }
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1100px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        
        .btn-view { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }

        /* نافذة العرض (Viewer) */
        #video-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
        }
        .viewer-box {
            background: white; width: 90%; max-width: 900px; height: 80vh; border-radius: 20px;
            position: relative; overflow: hidden; display: flex; flex-direction: column;
        }
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; cursor: pointer; color: black; z-index: 1001; }
        iframe { width: 100%; flex-grow: 1; border: none; }
        .viewer-footer { padding: 10px; text-align: center; background: #eee; }
    </style>
</head>
<body>

    <div class="header">
        <h1>FULL MARK | Platform</h1>
        <p>اضغط على المدرس للمعاينة داخل المنصة</p>
    </div>

    <div class="subject-grid">
        <div class="card">
            <h3>اللغة العربية</h3>
            <p>رضا الفاروق</p>
            <button class="btn-view" onclick="openViewer('https://t.me/s/EL_Farouk_Official')">معاينة المحاضرات</button>
        </div>

        <div class="card">
            <h3>الكيمياء</h3>
            <p>محمد عبد الجواد</p>
            <button class="btn-view" onclick="openViewer('https://t.me/s/m_abdelgawad')">معاينة المحاضرات</button>
        </div>

        <div class="card">
            <h3>الفيزياء</h3>
            <p>محمد عبد المعبود</p>
            <button class="btn-view" onclick="openViewer('https://t.me/s/Physics_Abdelmaboud')">معاينة المحاضرات</button>
        </div>
    </div>

    <div id="video-overlay">
        <div class="viewer-box">
            <span class="close-btn" onclick="closeViewer()">&times;</span>
            <iframe id="content-frame" src=""></iframe>
            <div class="viewer-footer">
                <p>إذا لم يظهر المحتوى، يمكنك <a id="direct-link" href="#" target="_blank" style="color: blue;">فتحه مباشرة في تليجرام</a></p>
            </div>
        </div>
    </div>

    <script>
        function openViewer(url) {
            document.getElementById('content-frame').src = url;
            document.getElementById('direct-link').href = url.replace('/s/', '/'); // تحويل لرابط تليجرام العادي
            document.getElementById('video-overlay').style.display = 'flex';
        }

        function closeViewer() {
            document.getElementById('video-overlay').style.display = 'none';
            document.getElementById('content-frame').src = "";
        }
    </script>
</body>
</html>
